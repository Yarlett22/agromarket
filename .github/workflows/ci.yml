name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go vet ./...
      - run: go build ./...

  frontend:
    name: Frontend (React + Webpack 5)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E — arquitectura completa en Docker
    runs-on: ubuntu-24.04   # Playwright aún no soporta Chromium en ubuntu 26.04
    needs: [backend, frontend]
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la arquitectura (13 contenedores + generador de certificados)
        run: docker compose up -d --build
      - name: Smoke test seguro (TLS · WAF · Keycloak · eventos · Postgres/NATS con TLS)
        run: |
          mkdir -p shots
          ./scripts/smoke-test.sh | tee shots/term-smoke.txt
      - name: Evidencias de terminal (contenedores, TLS, WAF)
        if: always()
        run: |
          mkdir -p shots
          docker compose ps --format "table {{.Service}}\t{{.Image}}\t{{.Status}}" > shots/term-ps.txt
          docker compose exec -T postgres psql -U agro -d agromarket -c "select pid, ssl, version, cipher from pg_stat_ssl where ssl" > shots/term-pg.txt
          curl -s http://localhost:8222/varz | python3 -c "import sys,json; d=json.load(sys.stdin); print('server_name   :', d['server_name']); print('version       :', d['version']); print('tls_required  :', d['tls_required']); print('tls_verify    :', d.get('tls_verify')); print('connections   :', d['connections'])" > shots/term-nats.txt
          curl -sk -o /dev/null -w "%{http_code}\n" "https://localhost:8443/api/catalog/products?q=1%27%20OR%20%271%27%3D%271" > /dev/null
          docker compose logs --no-color gateway | grep -o 'ModSecurity: Access denied.*\[msg "[^"]*"\]' | sed 's/\[file[^]]*\]//g; s/\[line[^]]*\]//g' | tail -4 > shots/term-waf.txt || true
      - name: Capturas de pantalla (Playwright)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          mkdir -p shots && python scripts/screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots/ }
      - name: Publicar capturas en docs/screenshots
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots && cp shots/*.png docs/screenshots/
          git config user.name "Yarlett Huaman"
          git config user.email "yarlett.huaman.b@uni.pe"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "docs: capturas de la demo [skip ci]" && git push)
      - name: Logs de los servicios
        if: always()
        run: docker compose logs --no-color --tail=40
