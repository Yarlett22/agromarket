name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go vet ./...
      - run: go build ./...

  frontend:
    name: Frontend (React + Webpack 5)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E — arquitectura completa en Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Levantar los 12 contenedores
        run: docker compose up -d --build
      - name: Smoke test (Gateway → Go → NATS → consumers → Postgres/Redis)
        run: ./scripts/smoke-test.sh
      - name: Capturas de pantalla (Playwright)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          mkdir -p shots && python scripts/screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots/ }
      - name: Publicar capturas en docs/screenshots
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots && cp shots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "docs: capturas de la demo [skip ci]" && git push)
      - name: Logs de los servicios
        if: always()
        run: docker compose logs --no-color --tail=40
