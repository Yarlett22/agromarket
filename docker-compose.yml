# AgroMarket — Arquitectura Full Stack distribuida y orientada a eventos
# Frontend → API Gateway → Backend → Event Bus → Event Consumers → Datos
#
#   docker compose up --build      →  http://localhost:8080

x-go-service: &go-service
  restart: unless-stopped
  environment: &go-env
    DATABASE_URL: postgres://agro:agro@postgres:5432/agromarket?sslmode=disable
    REDIS_ADDR: redis:6379
    NATS_URL: nats://nats:4222
    JWT_SECRET: ${JWT_SECRET:-agromarket-dev-secret}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    nats: { condition: service_started }

services:
  # ===================== FRONTEND =====================
  web:
    build: ./frontend
    restart: unless-stopped

  # ===================== API GATEWAY =====================
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, user-service, catalog-service, order-service, notification-service, analytics-service]
    restart: unless-stopped

  # ===================== BACKEND (Go) =====================
  user-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: user } }

  catalog-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: catalog } }

  order-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: order } }
    environment:
      <<: *go-env
      CATALOG_URL: http://catalog-service:8002

  # ===================== EVENT CONSUMERS (Go) =====================
  payment-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: payment } }
    environment:
      <<: *go-env
      PAYMENT_DELAY: 2s
      CREDIT_LIMIT: "5000"

  inventory-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: inventory } }

  notification-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: notification } }

  analytics-service:
    <<: *go-service
    build: { context: ./services, args: { SERVICE: analytics } }

  # ===================== EVENT BUS =====================
  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]          # 8222 = monitoreo HTTP de NATS
    ports: ["8222:8222"]
    restart: unless-stopped

  # ===================== DATOS =====================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro
      POSTGRES_DB: agromarket
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agromarket"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
