# API Gateway de AgroMarket (NGINX)
# Funciones: routing a microservicios, autenticación JWT centralizada (auth_request),
# rate limiting, logging estructurado y cabeceras de seguridad.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # ---------- Logging (formato JSON con tiempo de upstream) ----------
  log_format gateway escape=json '{"time":"$time_iso8601","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"upstream":"$upstream_addr","req_time":$request_time,"user":"$auth_user_id"}';
  access_log /dev/stdout gateway;
  error_log  /dev/stderr warn;

  # ---------- Rate limiting ----------
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/s;
  limit_req_status 429;

  # ---------- Upstreams (resolución por DNS de Docker) ----------
  upstream user_service         { server user-service:8001; }
  upstream catalog_service      { server catalog-service:8002; }
  upstream order_service        { server order-service:8003; }
  upstream notification_service { server notification-service:8004; }
  upstream analytics_service    { server analytics-service:8005; }
  upstream web                  { server web:80; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;

    set $auth_user_id "-";

    add_header X-Gateway "agromarket-nginx" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ---------- Autenticación centralizada ----------
    # Subpetición interna al User Service para validar el JWT.
    location = /_auth {
      internal;
      proxy_pass              http://user_service/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        Authorization $http_authorization;
    }

    # ---------- Rutas públicas ----------
    location /api/users/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://user_service/;
    }

    location /api/catalog/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://catalog_service/;
    }

    location /api/analytics {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://analytics_service/analytics;
    }

    # ---------- Rutas protegidas con JWT ----------
    location /api/orders {
      limit_req zone=api burst=40 nodelay;
      auth_request     /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $auth_user_id;
      rewrite ^/api(/orders.*)$ $1 break;
      proxy_pass http://order_service;
    }

    location /api/notifications {
      limit_req zone=api burst=40 nodelay;
      auth_request     /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_pass http://notification_service/notifications;
    }

    # Healthcheck del propio gateway
    location = /api/health {
      default_type application/json;
      return 200 '{"gateway":"ok"}';
    }

    error_page 401 = @unauthorized;
    location @unauthorized {
      default_type application/json;
      return 401 '{"error":"token ausente o inválido"}';
    }

    # ---------- Frontend (React + Webpack 5, PWA) ----------
    location / {
      proxy_pass http://web;
    }
  }
}
